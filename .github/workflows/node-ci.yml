name: Node.js CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server syntax
        run: node --check server.js
      - name: Run local HTTP contract tests
        run: node --test tests/api.test.mjs
